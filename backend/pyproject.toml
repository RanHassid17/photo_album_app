[project]
name = "album-backend"
version = "0.1.0"
description = "Photo Album Creator backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  # HEIC (every modern iPhone) and camera RAW (.CR3 etc.) are not readable by Pillow
  # alone; without these a Canon or iPhone library is invisible to the app.
  "pillow-heif>=0.18",
  "rawpy>=0.22",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "anthropic>=0.39",
  "celery>=5.4",
  "redis>=5.1",
  "pillow>=10.4",
  "exifread>=3.0",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "hdbscan>=0.8.38",
  "httpx>=0.27",
  "certifi>=2024.7",
]

[project.optional-dependencies]
vision = [
  "deepface>=0.0.93",
  "ultralytics>=8.3",
  # tf-keras is required for TF 2.16+ / Keras 3 compat with deepface/retinaface.
  "tf-keras>=2.16",
]
export = [
  "playwright>=1.48",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "piexif>=1.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
